<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rally 3D</title><style>html,body{margin:0;background:#07110d;color:white;font-family:system-ui;height:100%;overflow:hidden}body{display:grid;place-items:center}.m{font-size:20px;font-weight:800;text-align:center;padding:24px}.s{display:block;margin-top:8px;font-size:13px;font-weight:500;opacity:.75}</style></head><body><div class="m">Loading Rally 3D…<span class="s">Завантаження гри</span></div><script>(async()=>{try{const sourceUrl=location.href;sessionStorage.setItem('rallySourceUrl',sourceUrl);const files=['part0.txt','part1.txt','part2.txt','part3.txt','part4.txt'];const a=await Promise.all(files.map(x=>fetch(x,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Не завантажено '+x);return r.text()})));const b=atob(a.join(''));const u=Uint8Array.from(b,c=>c.charCodeAt(0));let html=new TextDecoder().decode(u);html=html.replaceAll('new URL(window.location.href)',"new URL(sessionStorage.getItem('rallySourceUrl')||window.location.href)");const blob=new Blob([html],{type:'text/html'});const blobUrl=URL.createObjectURL(blob);location.replace(blobUrl)}catch(e){document.body.innerHTML='<div class="m">Load error: '+String(e)+'</div>'}})();</script></body></html>
