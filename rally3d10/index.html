<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rally 3D</title><style>html,body{margin:0;background:#07110d;color:white;font-family:system-ui;height:100%}body{display:grid;place-items:center}.m{font-size:20px;font-weight:800}</style></head><body><div class="m">Loading Rally 3D…</div><script>(async()=>{try{const files=['part0.txt','part1.txt','part2.txt','part3.txt','part4.txt'];const a=await Promise.all(files.map(x=>fetch(x,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(x);return r.text()})));const b=atob(a.join(''));const u=Uint8Array.from(b,c=>c.charCodeAt(0));const html=new TextDecoder().decode(u);document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="m">Load error: '+e+'</div>'}})();</script></body></html>
