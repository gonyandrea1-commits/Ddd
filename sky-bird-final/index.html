*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#061827;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none}.g{position:relative;width:min(100vw,520px);height:100dvh;margin:auto;overflow:hidden;background:linear-gradient(#079deb,#65e6f4);box-shadow:0 0 40px #0008}canvas{width:100%;height:100%;display:block}.score{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:5;background:linear-gradient(#31b4ec,#147fc0);border:4px solid #fff;border-radius:28px;color:#fff;padding:8px 25px;text-align:center;box-shadow:0 6px 0 #075f90aa}.score small{font-weight:900}.score b{display:block;font-size:44px;line-height:1}.best{font-size:11px;color:#ffe033}.online{position:absolute;z-index:7;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:7px}.card{background:#073f5ddd;color:#fff;border:2px solid #ffffffdd;border-radius:16px;padding:8px 10px;box-shadow:0 5px 15px #0004;backdrop-filter:blur(7px)}.global{width:116px;text-align:center}.card small{display:block;font-size:9px;font-weight:900;opacity:.8}.global strong{display:block;font-size:20px;color:#ffdf2e}.global button{border:0;border-radius:8px;background:#ffffff20;color:#fff;padding:4px 7px;font-size:9px}.players{flex:1;max-height:105px;overflow:auto}.row{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:800;margin-top:4px}.row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pts{color:#ffdf32;font-weight:1000}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5cff62;margin-right:5px}.modal{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:#003b5b55;padding:20px}.box{width:min(100%,370px);background:linear-gradient(#1aa6df,#0878b6);border:4px solid #fff;border-radius:28px;color:#fff;text-align:center;padding:24px;box-shadow:0 15px 4 </style></head><body><div class="g"><canvas id="c"></canvas><div class="score"><small>★ SCORE ★</small><b id="score">0</b><div class="best">BEST <span id="best">0</span></div></div><div class="online"><div class="card global"><small>СПІЛЬНА КІМНАТА</small><strong>ВСІ</strong><button id="copy">копіювати лінк</button></div><div class="card players"><small>ГРАВЦІ • МАКС. РЕЗУЛЬТАТ</small><div id="plist"><div class="row"><span>Очікує входу…</span><span class="pts">0</span></div></div></div></div><div id="login" class="modal"><div class="box"><h1>Sky Bird</h1><p>Усі користувачі цієї сторінки входять в одну спільну кімнату.</p><input id="name" maxlength="20" placeholder="Ваше ім'я"><button id="join">УВІЙТИ В ГРУ</button><div id="status" class="status">Готово до підключення</div></div></div><div id="over" class="over hidden"><h2>Спробуй ще!</h2><div>Рахунок: <b id="final">0</b></div><button id="again">↻ ЩЕ РАЗ</button></div></div><script>
(()=>{const $=id=>document.getElementById(id),cv=$('c'),x=cv.getContext('2d');let W=390,H=780,D=1,gy=690,last=0,run=0,dead=0,score=0,best=+localStorage.skyBirdBest||0,pipes=[],spawn=0,speed=145;const b={x:105,y:320,vy:0,r:18,rot:0};$('best').textContent=best;function size(){let r=cv.parentElement.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,2);cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0);gy=H-82;b.x=W*.27;if(!run)b.y=H*.46}addEventListener('resize',size);size();function rr(a,b,c,d,r){x.beginPath();x.roundRect(a,b,c,d,r)}function pipe(px,py,w,h,top){if(h<=0)return;let g=x.createLinearGradient(px,0,px+w,0);g.addColorStop(0,'#249507');g.addColorStop(.25,'#65df17');g.addColorStop(.8,'#4dc20d');g.addColorStop(1,'#187705');x.fillStyle=g;rr(px+6,py,w-12,h,5);x.fill();x.strokeStyle='#247d0b88';x.lineWidth=2;for(let yy=py+12;yy<py+h-12;yy+=27)for(let xx=px+17;xx<px+w-16;xx+=27){rr(xx,yy,10,10,2);x.stroke()}let ch=25,cy=top?py+h-ch:py;x.fillStyle='#61d814';rr(px,cy,w,ch,6);x.fill();x.strokeStyle='#166d05';x.lineWidth=3;x.stroke()}function bird(){x.save();x.translate(b.x,b.y);x.rotate(b.rot);x.fillStyle='#ffad18';x.beginPath();x.moveTo(-14,0);x.lineTo(-35,-12);x.lineTo(-29,4);x.lineTo(-36,12);x.closePath();x.fill();let g=x.createRadialGradient(-5,-7,2,0,0,25);g.addColorStop(0,'#ff7744');g.addColorStop(1,'#cf2026');x.fillStyle=g;x.beginPath();x.ellipse(0,0,25,20,0,0,7);x.fill();x.fillStyle='#ffb838';x.beginPath();x.ellipse(4,11,15,7,0,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.ellipse(12,-7,10,12,0,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(16,-6,5,0,7);x.fill();x.fillStyle='#ffbd16';x.beginPath();x.moveTo(22,-1);x.lineTo(34,4);x.lineTo(22,9);x.closePath();x.fill();x.restore()}function draw(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#079deb');g.addColorStop(.75,'#72e7f1');g.addColorStop(1,'#d9f7d0');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#ffffffc9';for(let i=0;i<4;i++){let q=((i*150-performance.now()/70)%(W+180))-70,y=H*(.2+i*.12);x.beginPath();x.arc(q,y,28,0,7);x.arc(q+30,y+4,22,0,7);x.fill()}pipes.forEach(p=>{pipe(p.x,0,p.w,p.top,1);pipe(p.x,p.bot,p.w,gy-p.bot,0)});bird();x.fillStyle='#7ee523';x.fillRect(0,gy,W,35);x.fillStyle='#d98a42';x.fillRect(0,gy+35,W,H-gy-35)}function add(first=0){let w=Math.max(70,W*.19),gap=Math.max(155,Math.min(200,H*.23)),c=first?H*.5:180+Math.random()*Math.max(1,gy-330);pipes.push({x:first?W+25:W+15,w,top:c-gap/2,bot:c+gap/2,passed:0})}function reset(){score=0;$('score').textContent=0;$('over').classList.add('hidden');pipes=[];spawn=0;speed=Math.max(145,W*.37);b.y=H*.46;b.vy=0;dead=0;run=1;add(1);flap()}function flap(){if(run&&!dead)b.vy=-Math.max(310,H*.42)}function end(){if(dead)return;dead=1;run=0;best=Math.max(best,score);localStorage.skyBirdBest=best;$('best').textContent=best;$('final').textContent=score;window.syncOnline&&window.syncOnline();setTimeout(()=>$('over').classList.remove('hidden'),250)}function upd(dt){if(!run)return;b.vy+=Math.max(900,H*1.2)*dt;b.y+=b.vy*dt;b.rot=Math.max(-.4,Math.min(1.1,b.vy/650));spawn+=dt;if(spawn>1.55){spawn=0;add()}for(const p of pipes){p.x-=speed*dt;if(!p.passed&&p.x+p.w<b.x){p.passed=1;score++;$('score').textContent=score;best=Math.max(best,score);$('best').textContent=best;window.syncOnline&&window.syncOnline()}}pipes=pipes.filter(p=>p.x+p.w>-20);if(b.y+b.r>gy||b.y-b.r<0)return end();for(const p of pipes){let r=b.r*.72;if(b.x+r>p.x&&b.x-r<p.x+p.w&&(b.y-r<p.top||b.y+r>p.bot))return end()}}function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;if(!run&&!dead)b.y=H*.46+Math.sin(t/350)*5;upd(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);cv.addEventListener('pointerdown',e=>{e.preventDefault();if(!run&&!dead)reset();else flap()});$('again').onclick=e=>{e.stopPropagation();reset()};})();
</script><script>
(()=>{const API='AIzaSyBrXgydbhjQHFkdcprmCsRpOrR0gZGy7MQ',P='xnol-2957c',DOC=`https://firestore.googleapis.com/v1/projects/${P}/databases/(default)/documents/artifacts/${P}/public/data/rooms/skybird-GLOBAL`,$=id=>document.getElementById(id);let uid='',token='',name='',timer=0,poll=0,busy=0,myBest=+localStorage.skyBirdBest||0;const status=(m,bad=0)=>{$('status').textContent=m;$('status').classList.toggle('bad',!!bad)};async function req(url,opt={},ms=12000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{...opt,signal:c.signal}),tx=await r.text();let d={};try{d=tx?JSON.parse(tx):{}}catch{d={raw:tx}}if(!r.ok){let e=new Error(d?.error?.message||d?.error?.status||tx||`HTTP ${r.status}`);e.status=r.status;throw e}return d}finally{clearTimeout(t)}}async function login(){status('1/3 Вхід у Firebase…');let d=await req(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${encodeURIComponent(API)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});if(!d.idToken||!d.localId)throw Error('Firebase не повернув токен');token=d.idToken;uid=d.localId}const iv=n=>({integerValue:String(Math.max(0,Math.floor(+n||0)))}),pv=()=>{let cur=+$('score').textContent||0;myBest=Math.max(myBest,+localStorage.skyBirdBest||0,cur);localStorage.skyBirdBest=myBest;return{mapValue:{fields:{name:{stringValue:name},best:iv(myBest),current:iv(cur),online:{booleanValue:true},lastSeenMs:iv(Date.now())}}}};async function write(){if(!token||!uid||busy)return;busy=1;try{let fp=`players.\`${uid}\``,url=`${DOC}?updateMask.fieldPaths=${encodeURIComponent(fp)}`,body={fields:{players:{mapValue:{fields:{[uid]:pv()}}}}};await req(url,{method:'PATCH',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify(body)},10000)}finally{busy=0}}function prim(v){if(!v)return null;if('stringValue'in v)return v.stringValue;if('integerValue'in v)return +v.integerValue;if('doubleValue'in v)return +v.doubleValue;if('booleanValue'in v)return !!v.booleanValue;return null}function render(d){let m=d?.fields?.players?.mapValue?.fields||{},now=Date.now(),a=Object.entries(m).map(([id,v])=>{let f=v?.mapValue?.fields||{};return{id,name:prim(f.name)||'Гравець',best:+prim(f.best)||0,current:+prim(f.current)||0,on:prim(f.online)!==false,last:+prim(f.lastSeenMs)||0}}).filter(p=>p.on&&(!p.last||now-p.last<20000)).sort((a,b)=>b.best-a.best||b.current-a.current||a.name.localeCompare(b.name));$('plist').innerHTML=a.length?a.map((p,i)=>`<div class="row"><span><i class="dot"></i>${i===0?'🏆 ':''}${esc(p.name)}${p.id===uid?' (ви)':''}</span><span class="pts">${p.best}</span></div>`).join(''):'<div class="row"><span>Немає активних гравців</span><span class="pts">0</span></div>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]))}async function read(){if(!token)return;try{render(await req(DOC,{headers:{Authorization:`Bearer ${token}`}},10000))}catch(e){if(e.status!==404)throw e}}async function connect(){name=$('name').value.trim().slice(0,20);if(!name)return $('name').focus();localStorage.skyBirdName=name;$('join').disabled=1;$('join').textContent='ПІДКЛЮЧЕННЯ…';try{await login();status('2/3 Вхід у спільну кімнату…');await write();status('3/3 Завантаження гравців…');await read();clearInterval(timer);clearInterval(poll);timer=setInterval(()=>write().catch(console.error),2000);poll=setInterval(()=>read().catch(console.error),1500);$('login').classList.add('hidden')}catch(e){console.error(e);$('join').disabled=0;$('join').textContent='СПРОБУВАТИ ЩЕ';let m=e.message||'Невідома помилка';if(m.includes('OPERATION_NOT_ALLOWED'))m='У Firebase треба увімкнути Anonymous Authentication.';else if(m.includes('PERMISSION_DENIED'))m='Firestore Rules не дозволяють доступ.';else if(m.includes('API_KEY'))m='Firebase відхилив API key для цього сайту.';else if(m.includes('Failed to fetch')||m.includes('aborted'))m='Не вдал
