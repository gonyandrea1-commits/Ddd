<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Sky Bird Global</title><script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore-compat.js"></script><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#061827;font-family:Arial Rounded MT Bold,system-ui,sans-serif;touch-action:none;user-select:none}.game{position:relative;width:min(100vw,520px);height:100dvh;margin:auto;overflow:hidden;background:linear-gradient(#079deb,#65e6f4);box-shadow:0 0 40px #0007}canvas{width:100%;height:100%;display:block}.score{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:linear-gradient(#31b4ec,#147fc0);border:4px solid #fff;border-radius:25px;color:#fff;padding:8px 24px;text-align:center;box-shadow:0 6px 0 #075f90aa;z-index:5}.score small{font-weight:900}.score b{display:block;font-size:42px;line-height:1}.best{font-size:11px;color:#ffe033}.online{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:7px;z-index:7}.card{background:#073f5ddd;color:#fff;border:2px solid #ffffffdd;border-radius:15px;padding:8px 10px;box-shadow:0 5px 15px #0004;backdrop-filter:blur(7px)}.global{width:112px;text-align:center}.global small,.players small{display:block;font-size:9px;font-weight:900;opacity:.8}.global strong{display:block;font-size:18px;color:#ffdf2e}.global button{border:0;border-radius:8px;background:#ffffff20;color:#fff;padding:4px 7px;font-size:9px}.players{flex:1;max-height:104px;overflow:auto}.row{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:850;margin-top:4px}.row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pts{color:#ffdf32;font-weight:1000}.modal{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:#003b5b55;padding:20px}.box{width:min(100%,360px);background:linear-gradient(#1aa6df,#0878b6);border:4px solid #fff;border-radius:28px;color:#fff;text-align:center;padding:24px;box-shadow:0 15px 40px #0005}.box h1{margin:0 0 8px;font-size:34px}.box p{font-size:13px;line-height:1.4}.box input{width:100%;border:0;outline:0;border-radius:14px;padding:13px 14px;font-size:16px;font-weight:800;margin:8px 0 12px}.box button,.go button{border:0;border-radius:15px;padding:13px 22px;background:linear-gradient(#ffdd39,#f5a600);color:#fff;font-weight:1000;font-size:17px;box-shadow:0 5px 0 #b97800}.err{margin-top:10px;background:#7d152eaa;border-radius:10px;padding:8px;font-size:12px;white-space:pre-wrap}.hidden{display:none!important}.go{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:15;width:min(82%,330px);text-align:center;background:#0a79b7ef;border:4px solid #fff;border-radius:25px;color:#fff;padding:20px;box-shadow:0 10px 30px #0005}.go h2{margin:0 0 10px;font-size:30px}</style></head><body><div class="game"><canvas id="c"></canvas><div class="score"><small>★ SCORE ★</small><b id="score">0</b><div class="best">BEST <span id="best">0</span></div></div><div class="online"><div class="card global"><small>СПІЛЬНА КІМНАТА</small><strong>ВСІ</strong><button id="copy">копіювати лінк</button></div><div class="card players"><small>ГРАВЦІ • МАКС. РЕЗУЛЬТАТ</small><div id="plist"><div class="row"><span>Підключення…</span><span class="pts">0</span></div></div></div></div><div id="login" class="modal"><div class="box"><h1>Sky Bird</h1><p>Усі, хто відкриває цю сторінку, автоматично заходять в одну спільну кімнату.</p><input id="name" maxlength="20" placeholder="Ваше ім'я"><button id="join">УВІЙТИ В ГРУ</button><div id="err" class="err hidden"></div></div></div><div id="over" class="go hidden"><h2>Спробуй ще!</h2><div>Рахунок: <b id="final">0</b></div><button id="again">↻ ЩЕ РАЗ</button></div></div><script>const cfg={apiKey:'AIzaSyBrXgydbhjQHFkdcprmCsRpOrR0gZGy7MQ',authDomain:'xnol-2957c.firebaseapp.com',projectId:'xnol-2957c',storageBucket:'xnol-2957c.firebasestorage.app',messagingSenderId:'745668472127',appId:'1:745668472127:web:06467660c4ff26b843778a'};firebase.initializeApp(cfg);const auth=firebase.auth(),db=firebase.firestore(),APP=cfg.projectId;const $=id=>document.getElementById(id),canvas=$('c'),ctx=canvas.getContext('2d');let W,H,D=1,ground=0,last=0,running=false,dead=false,score=0,best=+localStorage.skyBirdBest||0,pipes=[],spawn=0,speed=150;const bird={x:100,y:300,vy:0,r:17,rot:0};$('best').textContent=best;function resize(){const r=canvas.parentElement.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);ground=H-82;bird.x=W*.27;if(!running)bird.y=H*.46}addEventListener('resize',resize);resize();function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function pipe(x,y,w,h,top){if(h<=0)return;let g=ctx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,'#249507');g.addColorStop(.25,'#65df17');g.addColorStop(.8,'#4dc20d');g.addColorStop(1,'#187705');ctx.fillStyle=g;rr(x+6,y,w-12,h,5);ctx.fill();ctx.strokeStyle='#247d0b88';ctx.lineWidth=2;for(let yy=y+12;yy<y+h-12;yy+=27)for(let xx=x+17;xx<x+w-16;xx+=27){rr(xx,yy,10,10,2);ctx.stroke()}let ch=25,cy=top?y+h-ch:y;ctx.fillStyle='#61d814';rr(x,cy,w,ch,6);ctx.fill();ctx.strokeStyle='#166d05';ctx.lineWidth=3;ctx.stroke()}function drawBird(){ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);ctx.fillStyle='#ffad18';ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(-35,-12);ctx.lineTo(-29,4);ctx.lineTo(-36,12);ctx.closePath();ctx.fill();let g=ctx.createRadialGradient(-5,-7,2,0,0,25);g.addColorStop(0,'#ff7744');g.addColorStop(1,'#cf2026');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,25,20,0,0,7);ctx.fill();ctx.fillStyle='#ffb838';ctx.beginPath();ctx.ellipse(4,11,15,7,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(12,-7,10,12,0,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(16,-6,5,0,7);ctx.fill();ctx.fillStyle='#ffbd16';ctx.beginPath();ctx.moveTo(22,-1);ctx.lineTo(34,4);ctx.lineTo(22,9);ctx.closePath();ctx.fill();ctx.restore()}function render(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#079deb');g.addColorStop(.75,'#72e7f1');g.addColorStop(1,'#d9f7d0');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffffffc9';for(let i=0;i<4;i++){let x=((i*150-performance.now()/70)%(W+180))-70,y=H*(.2+i*.12);ctx.beginPath();ctx.arc(x,y,28,0,7);ctx.arc(x+30,y+4,22,0,7);ctx.fill()}for(const p of pipes){pipe(p.x,0,p.w,p.top,true);pipe(p.x,p.bot,p.w,ground-p.bot,false)}drawBird();ctx.fillStyle='#7ee523';ctx.fillRect(0,ground,W,35);ctx.fillStyle='#d98a42';ctx.fillRect(0,ground+35,W,H-ground-35)}function makePipe(first=false){let w=Math.max(70,W*.19),gap=Math.max(155,Math.min(200,H*.23)),c=180+Math.random()*Math.max(1,ground-330);if(first)c=H*.5;pipes.push({x:first?W+25:W+15,w,top:c-gap/2,bot:c+gap/2,passed:false})}function reset(){score=0;$('score').textContent=0;$('over').classList.add('hidden');pipes=[];spawn=0;speed=Math.max(145,W*.37);bird.y=H*.46;bird.vy=0;dead=false;running=true;makePipe(true);flap()}function flap(){if(!running||dead)return;bird.vy=-Math.max(310,H*.42)}function end(){if(dead)return;dead=true;running=false;best=Math.max(best,score);localStorage.skyBirdBest=best;$('best').textContent=best;$('final').textContent=score;syncBest();setTimeout(()=>$('over').classList.remove('hidden'),250)}function update(dt){if(!running)return;bird.vy+=Math.max(900,H*1.2)*dt;bird.y+=bird.vy*dt;bird.rot=Math.max(-.4,Math.min(1.1,bird.vy/650));spawn+=dt;if(spawn>1.55){spawn=0;makePipe()}for(const p of pipes){p.x-=speed*dt;if(!p.passed&&p.x+p.w<bird.x){p.passed=true;score++;$('score').textContent=score;best=Math.max(best,score);$('best').textContent=best;syncBest()}}pipes=pipes.filter(p=>p.x+p.w>-20);if(bird.y+bird.r>ground||bird.y-bird.r<0)return end();for(const p of pipes){let bx=bird.x,by=bird.y,r=bird.r*.72;if(bx+r>p.x&&bx-r<p.x+p.w&&(by-r<p.top||by+r>p.bot))return end()}}function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;if(!running&&!dead)bird.y=H*.46+Math.sin(t/350)*5;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(!running&&!dead)reset();else flap()});$('again').onclick=e=>{e.stopPropagation();reset()};let uid='',me='',ref=null;function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function roomRef(){return db.collection('artifacts').doc(APP).collection('public').doc('data').collection('rooms').doc('skybird-GLOBAL')}function showPlayers(d){let a=Object.entries(d.players||{}).map(([id,p])=>({id,name:p.name||'Гравець',best:+p.best||0})).sort((a,b)=>b.best-a.best);$('plist').innerHTML=a.length?a.map((p,i)=>`<div class="row"><span>${i===0?'🏆 ':''}${esc(p.name)}${p.id===uid?' (ви)':''}</span><span class="pts">${p.best}</span></div>`).join(''):'<div class="row"><span>Немає гравців</span><span class="pts">0</span></div>'}async function syncBest(){if(!ref||!uid)return;best=Math.max(best,score,+localStorage.skyBirdBest||0);localStorage.skyBirdBest=best;try{await ref.set({players:{[uid]:{name:me,best}},updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}catch(e){console.error(e)}}async function connect(){const err=$('err');err.classList.add('hidden');me=$('name').value.trim().slice(0,20);if(!me)return $('name').focus();$('join').disabled=true;$('join').textContent='ПІДКЛЮЧЕННЯ...';try{const u=await auth.signInAnonymously();uid=u.user.uid;ref=roomRef();await ref.set({type:'skybird-global',players:{[uid]:{name:me,best}},updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});ref.onSnapshot(s=>{if(s.exists)showPlayers(s.data())},e=>{err.textContent='Firestore: '+e.message;err.classList.remove('hidden')});localStorage.skyBirdName=me;$('login').classList.add('hidden')}catch(e){console.error(e);err.textContent='Не вдалося увійти.\n'+(e.message||e.code);err.classList.remove('hidden');$('join').disabled=false;$('join').textContent='СПРОБУВАТИ ЩЕ'}}$('name').value=localStorage.skyBirdName||'';$('join').onclick=connect;$('name').onkeydown=e=>{if(e.key==='Enter')connect()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('copy').textContent='готово ✓';setTimeout(()=>$('copy').textContent='копіювати лінк',900)}catch(e){}};</script></body></html>
